# Release smoke test: boots a released GHCR image against a throwaway
# database. Used by `./dev.py smoke [vX.Y.Z]` — not for real deployments.
#
# Differences from docker-compose.prod.yml, on purpose:
# - image tag comes from ${SMOKE_VERSION} (set by dev.py)
# - no container_name, and only throwaway named volumes (static, media, documents,
#   questionnaires) → runs alongside the dev stack;
#   `down -v` under the smoke project name removes every trace
# - no host bind mounts (backups/media/documents) — the data directories are
#   named volumes, so uploads work but nothing touches real data
# - ephemeral localhost port instead of 8000
services:
  postgres:
    image: postgres:17-alpine@sha256:f9cf3e1f0066f0eb0c48707d864f0ac5941e9ff454a072077d97a4d278d07d73
    environment:
      - POSTGRES_DB=my_practice
      - POSTGRES_USER=my_practice
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U my_practice -d my_practice']
      interval: 5s
      timeout: 5s
      retries: 12

  # Same one-shot as docker-compose.prod.yml, for the staticfiles volume.
  fix-ownership:
    image: ghcr.io/dholbach/my-practice:${SMOKE_VERSION}
    restart: "no"
    network_mode: none
    user: "0:0"
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
    security_opt:
      - no-new-privileges:true
    volumes:
      - static_data:/app/staticfiles
      - media:/app/media
      - documents:/my-practice-data/documents
      - questionnaires:/my-practice-data/questionnaires
    command: chown 1000:1000 /app/staticfiles /app/media /my-practice-data/documents /my-practice-data/questionnaires

  django:
    image: ghcr.io/dholbach/my-practice:${SMOKE_VERSION}
    user: "1000:1000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - static_data:/app/staticfiles
      - media:/app/media
      - documents:/my-practice-data/documents
      - questionnaires:/my-practice-data/questionnaires
    ports:
      - "127.0.0.1::8000"
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - HOME=/tmp
      - DJANGO_DEBUG=False
      - SECURE_SSL_REDIRECT=false
      - POSTGRES_DB=my_practice
      - POSTGRES_USER=my_practice
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - FERNET_KEY=${FERNET_KEY}
      - UPDATE_CHECK_DISABLED=true
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/accounts/login/"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
    depends_on:
      fix-ownership:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput --ignore tailwind.css &&
             gunicorn --bind 0.0.0.0:8000 --workers 2 --timeout 300 config.wsgi:application"

volumes:
  static_data:
  media:
  documents:
  questionnaires:
