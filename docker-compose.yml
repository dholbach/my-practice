services:
  postgres:
    image: postgres:17-alpine
    container_name: my-practice-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-my_practice}
      - POSTGRES_USER=${POSTGRES_USER:-my_practice}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-my_practice} -d ${POSTGRES_DB:-my_practice}']
      interval: 10s
      timeout: 5s
      retries: 5

  django:
    build:
      context: ./app
      target: development
    container_name: my-practice-django
    restart: unless-stopped
    network_mode: host
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-django-insecure-dev-key}
      - DJANGO_DEBUG=${DJANGO_DEBUG:-True}
      - DJANGO_LANGUAGE_CODE=${DJANGO_LANGUAGE_CODE:-de-de}
      - DJANGO_TIME_ZONE=${DJANGO_TIME_ZONE:-Europe/Berlin}
      - POSTGRES_DB=${POSTGRES_DB:-my_practice}
      - POSTGRES_USER=${POSTGRES_USER:-my_practice}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme123}
      - POSTGRES_HOST=127.0.0.1
      - POSTGRES_PORT=5432
      - USE_PROTON_BRIDGE=${USE_PROTON_BRIDGE:-false}
      - EMAIL_HOST=${EMAIL_HOST:-127.0.0.1}
      - EMAIL_PORT=${EMAIL_PORT:-1025}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER:-}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD:-}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL:-}
      - GOOGLE_CALENDAR_CLIENT_ID=${GOOGLE_CALENDAR_CLIENT_ID:-}
      - GOOGLE_CALENDAR_CLIENT_SECRET=${GOOGLE_CALENDAR_CLIENT_SECRET:-}
      - FERNET_KEY=${FERNET_KEY:-}
      - MY_PRACTICE_DATA_DIR=/my-practice-data
      - MY_PRACTICE_REPO_ROOT=/repo
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./app:/app
      # Named volume so the image's `npm install` (app/Dockerfile's development
      # stage) isn't shadowed by the ./app:/app bind mount above — the host
      # checkout has no node_modules/ of its own (see app/.dockerignore).
      # Separate volume per service: both containers populate it from their
      # own image on first start, and sharing one volume races the two.
      - node_modules_django:/app/node_modules
      # test_release_guardrails compares version strings across prod.py and
      # docker-compose.prod.yml at the repo root, which only ./app:/app can't
      # reach. Mounted as a directory, not per file: a single-file bind mount
      # pins the inode, and `sed -i` or an editor save replaces the file, so
      # the container kept seeing the pre-bump version until recreated.
      - .:/repo:ro
      # Backups and media live OUTSIDE the repo at $MY_PRACTICE_DATA_DIR (set in .env).
      # Default: ../my-practice-data (sibling directory next to the repo clone).
      - ${MY_PRACTICE_DATA_DIR:-../my-practice-data}/backups:/app/backups
      - static_data:/app/staticfiles
      - ${MY_PRACTICE_DATA_DIR:-../my-practice-data}/media:/app/media
      - ${MY_PRACTICE_DATA_DIR:-../my-practice-data}/documents:/my-practice-data/documents
      - ${MY_PRACTICE_DATA_DIR:-../my-practice-data}/questionnaires:/my-practice-data/questionnaires
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/admin/login/"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput --ignore tailwind.css &&
             gunicorn --bind 0.0.0.0:8000 --workers 1 --timeout 300 --reload config.wsgi:application"

  tailwind:
    build:
      context: ./app
      target: development
    container_name: my-practice-tailwind
    restart: unless-stopped
    volumes:
      - ./app:/app
      - node_modules_tailwind:/app/node_modules
    working_dir: /app
    command: npm run watch:css

volumes:
  postgres_data:
    driver: local
  static_data:
    driver: local
  node_modules_django:
    driver: local
  node_modules_tailwind:
    driver: local
