name: Codebase metrics

# Refreshes docs/development/ on the first of each month so the growth and
# commit-mix trend is visible without anyone remembering to look.
on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      # fetch-depth: 0 is required, not an optimisation: the script walks the
      # whole history month by month and reads every tag. A shallow clone
      # silently produces a truncated series rather than failing.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      # Stdlib only — no pip install step needed.
      - name: Regenerate metrics
        run: python scripts/codebase_metrics.py

      # `main` is protected by a ruleset requiring the `lint` and `test` checks
      # with no bypass actors, so this job cannot push to main directly. It also
      # deliberately does not open the PR itself: GitHub does not trigger
      # workflows for events raised by GITHUB_TOKEN, so a bot-authored PR would
      # sit with both required checks pending forever and could never merge.
      # Pushing the branch and handing over a compare link keeps the PR authored
      # by a human, which makes CI run normally.
      - name: Push refresh branch
        id: push
        run: |
          if git diff --quiet -- docs/development/; then
            echo "No change in docs/development/ this month."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          branch="chore/metrics-$(date -u +%Y-%m)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add docs/development/
          git commit -m "chore: refresh codebase metrics for $(date -u +%Y-%m)"
          git push --force-with-lease origin "$branch"

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      # The compare link carries a prefilled `body`, which overrides the repo's
      # generic pull request template. That matters here: the whole diff is
      # generated output — Mermaid blocks and Markdown tables show up as raw
      # +/- text and are close to unreadable in review. The body instead points
      # at the *rendered* page on both sides, which is what a reviewer actually
      # needs to see. jq -sRr @uri does the percent-encoding; jq is preinstalled
      # on GitHub-hosted runners.
      - name: Summarise
        if: steps.push.outputs.changed == 'true'
        env:
          BRANCH: ${{ steps.push.outputs.branch }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          body=$(cat <<EOF
          ## What does this change?

          Scheduled refresh of the generated metrics page for $(date -u +%Y-%m).
          No hand-written content — \`scripts/codebase_metrics.py\` rebuilds it
          from git history.

          | | |
          | --- | --- |
          | Rendered result on this branch | $REPO_URL/tree/$BRANCH/docs/development |
          | Current version on \`main\` | $REPO_URL/tree/main/docs/development |

          The diff below is generated output: Mermaid chart blocks and Markdown
          tables appear as raw text. Read the rendered pages above instead.

          ## Privacy check

          - [x] No real names, contact details, or practice data
          - [x] \`metrics.json\` holds only commit counts, type labels, release tags and line counts of tracked source files — no message bodies, no paths into client data

          ## Testing

          - [x] Docs-only change; CI short-circuits the suite for these (see \`.github/workflows/ci.yml\`)
          - [x] The script is idempotent — re-running it on the same commit reproduces this output exactly (\`scripts/codebase_metrics.py --check\`)

          ## Notes for reviewer

          Worth a glance at the trend rather than the numbers: is \`feat:\` still
          happening, and is anything other than tests and migrations growing?
          EOF
          )
          # The heredoc above is indented to match the YAML block; strip it back
          # off so the Markdown renders as Markdown and not as a code block.
          body=$(echo "$body" | sed 's/^          //')
          encoded=$(printf '%s' "$body" | jq -sRr @uri)
          url="$REPO_URL/compare/main...$BRANCH?expand=1&body=$encoded"

          {
            echo "### Codebase metrics refreshed"
            echo
            echo "Branch \`$BRANCH\` pushed."
            echo
            echo "[Open the pull request]($url) — the link prefills a description"
            echo "with rendered-page links, since the raw diff is generated output."
          } >> "$GITHUB_STEP_SUMMARY"
