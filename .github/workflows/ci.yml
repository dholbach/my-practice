name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Only the token scope the jobs actually use. Nothing here writes to the repo;
# the one workflow that does (codebase-metrics.yml) asks for `contents: write`
# explicitly.
permissions:
  contents: read

# Superseded runs on a PR branch are pointless — the newer push already covers
# the same tree. Pushes to main are never cancelled: every commit on main must
# be verified on its own, and cancelling mid-run would leave a gap in that
# record. `github.ref` is the branch on a push and refs/pull/N/merge on a PR,
# so the group is per-branch either way.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Docs-only pull requests skip the expensive steps in both jobs. The skip is a
# short-circuit *inside* each job, deliberately not `paths-ignore:` on the
# workflow and not `if:` on the job — `lint` and `test` are required status
# checks on main's ruleset with no bypass actors, and a required check that
# never runs stays pending forever, which would make every docs PR permanently
# unmergeable. Short-circuiting keeps both jobs running and reporting a real
# success, so the gate is satisfied in seconds instead of two minutes.
#
# The decision itself lives in scripts/ci_docs_only.sh — it used to be two
# inline copies that had to be edited in lockstep. See that script for why it
# is not a separate job wired up with `needs:`.

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # fetch-depth: 0 so the docs-only diff below can reach the PR base commit,
      # and so the secret scan sees the whole history rather than one commit.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect docs-only change
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/ci_docs_only.sh

      - name: Set up Python 3.14
        if: steps.scope.outputs.code == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: app/requirements-dev.txt

      # Read the pins from requirements-dev.txt rather than duplicating them
      # here. A second copy of the ruff version drifted once already (CI ran
      # 0.15.18 while `./dev.py quality` ran 0.16.3), which silently changes
      # what "lint passes" means between CI and a local run. The same pin is
      # what the pre-commit hooks resolve to, since those are `system` hooks.
      - name: Install lint tooling
        if: steps.scope.outputs.code == 'true'
        run: |
          pip install \
            "$(grep -E '^ruff==' app/requirements-dev.txt)" \
            "$(grep -E '^pre-commit==' app/requirements-dev.txt)"

      - name: Lint
        if: steps.scope.outputs.code == 'true'
        working-directory: app
        run: ruff check .

      - name: Format
        if: steps.scope.outputs.code == 'true'
        working-directory: app
        run: ruff format --check --diff .

      # dev.py, prod.py and scripts/*.py live outside ./app, so the step above
      # never saw them — `./dev.py quality` reaches them only by piping each
      # through the container's ruff over stdin. They have their own ruff.toml
      # (a lower target-version: they run on the host Python, where 3.14's
      # bracketless `except A, B:` is a SyntaxError), which ruff picks up as
      # the nearest config when invoked from the repo root.
      - name: Lint repo-root Python
        if: steps.scope.outputs.code == 'true'
        run: ruff check dev.py prod.py scripts/*.py

      - name: Format repo-root Python
        if: steps.scope.outputs.code == 'true'
        run: ruff format --check --diff dev.py prod.py scripts/*.py

      # prod.py ships as a single stdlib-only file and cannot import a shared
      # module, so one helper is duplicated in dev.py on purpose. Ruff has no
      # opinion about two identical functions in two files; this does.
      - name: Check duplicated helpers stay in sync
        if: steps.scope.outputs.code == 'true'
        run: python scripts/check_shared_helpers.py

      # requirements-dev.txt duplicates every runtime pin (Dependabot does not
      # resolve `-r` includes when raising a security-update PR). The two had
      # already drifted: requirements.txt pinned sqlparse to close
      # PYSEC-2026-3696..3699 and requirements-dev.txt — the file CI installs —
      # did not carry the pin at all, so the suite ran against the vulnerable
      # version the production image did not ship.
      - name: Check requirements files stay in sync
        if: steps.scope.outputs.code == 'true'
        run: python scripts/check_requirements_sync.py

      # shellcheck ships preinstalled on GitHub-hosted ubuntu-latest runners.
      # -S warning skips style/info-level nitpicks (SC2181 "$?" checks, SC2162
      # "read -r", etc.) so the gate catches real bugs — like the inline .env
      # comment that broke scripts/backup.sh's export line — without forcing
      # a style rewrite of scripts that already work.
      - name: Shellcheck
        if: steps.scope.outputs.code == 'true'
        run: shellcheck -S warning scripts/*.sh

      # The hooks are only as good as each clone's `pre-commit install`, and
      # nothing makes that happen. Running the same config here means a
      # contributor who never installed them still gets the checks, and it
      # proves the hook config itself still works before someone hits a broken
      # one mid-commit.
      #
      # SKIP=gitleaks: that hook is `gitleaks protect --staged`, which scans
      # the *index*. Under `--all-files` nothing is staged, so it reports a
      # pass without looking at anything — worse than not running it. The step
      # below does the real scan.
      - name: Cache pre-commit environments
        if: steps.scope.outputs.code == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Pre-commit hooks
        if: steps.scope.outputs.code == 'true'
        env:
          SKIP: gitleaks
        run: pre-commit run --all-files --show-diff-on-failure

      # The version comes out of .pre-commit-config.yaml so there is one
      # gitleaks version in the repo, not two that can drift.
      #
      # `detect` walks git history, not just the working tree: a secret that
      # was committed and later deleted is still a leaked secret. History is
      # clean as of this workflow landing. If a genuinely false positive ever
      # turns up, add its fingerprint to .gitleaksignore rather than dropping
      # the step.
      - name: Scan for secrets (gitleaks)
        if: steps.scope.outputs.code == 'true'
        run: |
          rev="$(awk '/gitleaks\/gitleaks/ {found=1} found && /rev:/ {print $2; exit}' \
            .pre-commit-config.yaml)"
          version="${rev#v}"
          echo "gitleaks ${version} (from .pre-commit-config.yaml)"
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks detect --source . --redact --no-banner --verbose

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: my_practice
          POSTGRES_USER: my_practice
          POSTGRES_PASSWORD: changeme123
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U my_practice -d my_practice"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # STORAGES picks CompressedManifestStaticFilesStorage when DJANGO_DEBUG is
      # not True, and that backend raises on any {% static %} lookup without a
      # collectstatic manifest. The test runner forces settings.DEBUG=False at
      # runtime, but STORAGES is already resolved at import time — so this has to
      # be set in the environment, exactly as docker-compose.yml does for dev.
      DJANGO_DEBUG: "True"
      DJANGO_SECRET_KEY: django-insecure-ci-key
      POSTGRES_DB: my_practice
      POSTGRES_USER: my_practice
      POSTGRES_PASSWORD: changeme123
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      MY_PRACTICE_DATA_DIR: /tmp/my-practice-data

    steps:
      # fetch-depth: 0 so the docs-only diff below can reach the PR base commit.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect docs-only change
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/ci_docs_only.sh

      # Mirrors the production stage's runtime packages in app/Dockerfile:
      # cairo/pango/gdk-pixbuf for WeasyPrint's PDF rendering, ghostscript for
      # utils/file_processing.py, and gettext for the makemessages run inside
      # test_i18n_coverage.test_no_unextracted_strings.
      - name: Install system dependencies
        if: steps.scope.outputs.code == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcairo2 \
            libpango-1.0-0 \
            libpangocairo-1.0-0 \
            libgdk-pixbuf-2.0-0 \
            shared-mime-info \
            fonts-liberation \
            ghostscript \
            gettext

      - name: Set up Python 3.14
        if: steps.scope.outputs.code == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: app/requirements-dev.txt

      - name: Install Python dependencies
        if: steps.scope.outputs.code == 'true'
        working-directory: app
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Create data directories
        if: steps.scope.outputs.code == 'true'
        run: mkdir -p /tmp/my-practice-data/{documents,questionnaires,media,backups}

      - name: Compile translation catalogs
        if: steps.scope.outputs.code == 'true'
        working-directory: app
        run: python manage.py compilemessages

      # On failure, re-run serially before giving up. Django's parallel runner
      # pickles results back to the parent, and an errored test whose traceback
      # can't be pickled kills the whole run with "cannot pickle 'traceback'
      # object" at the first error — so any later failures stay hidden and you
      # find them one red round at a time. The serial re-run costs nothing on a
      # green build and produces a complete report when it matters.
      - name: Django tests
        if: steps.scope.outputs.code == 'true'
        working-directory: app
        run: python manage.py test --parallel || python manage.py test

      # Runs after the tests so a type error never hides a test report.
      #
      # Scoped to the modules mypy.ini already declares `disallow_untyped_defs`
      # for — the config had that strictness ladder from the start but nothing
      # ever ran it, so "typed" meant whatever survived review. --follow-imports
      # =silent keeps the gate on those modules instead of failing on errors in
      # everything they happen to import; widen the path list as more of the
      # tree is annotated.
      - name: Type check (mypy)
        if: steps.scope.outputs.code == 'true'
        working-directory: app
        run: |
          mypy --follow-imports=silent \
            my_practice/models \
            my_practice/utils/calculations.py \
            my_practice/utils/date_helpers.py \
            my_practice/utils/invoice_helpers.py \
            my_practice/utils/revenue_helpers.py

      # The suite runs with DJANGO_DEBUG=True (see the note on the job env), so
      # the whole `if not DEBUG:` block in config/settings.py — every security
      # header, cookie and HSTS setting — is never evaluated by any test. This
      # step is the only thing that looks at it.
      #
      # SECURE_SSL_REDIRECT is opt-in by design (the app supports running behind
      # a plain-HTTP reverse proxy), so check the hardened configuration: that is
      # the one whose regressions matter. --fail-level WARNING because every
      # finding `--deploy` reports is a warning; without it the step always
      # passes. The key is generated rather than reusing the job's placeholder,
      # which would trip security.W009 on its `django-insecure-` prefix.
      - name: Django deployment checks
        if: steps.scope.outputs.code == 'true'
        working-directory: app
        env:
          DJANGO_DEBUG: "False"
          SECURE_SSL_REDIRECT: "true"
        run: |
          DJANGO_SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(64))')" \
            python manage.py check --deploy --fail-level WARNING

      # Plain `node <file>` runners, the same set ./dev.py test-js executes.
      # They import nothing from node_modules, so the runner's preinstalled Node
      # is enough — no setup-node step and no `npm ci` needed.
      #
      # Globbed, not listed: this used to be a hand-maintained copy of the file
      # list in dev.py, and it broke the build the first time a test file was
      # deleted (global-search.test.js, P-047). The browser-only suites under
      # static/js/tests/ are named test_*.js and correctly don't match.
      # The step shell is `bash -e`, so the first failing file fails the step.
      - name: JavaScript tests
        if: steps.scope.outputs.code == 'true'
        working-directory: app
        run: |
          node --version
          for suite in static/js/*.test.js static/js/*.test.extended.js; do
            echo "--- $suite"
            node "$suite"
          done
