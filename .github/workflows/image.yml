name: Build & push Docker image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # workflow_dispatch: check out the requested tag
          # push (tag): github.event.inputs.tag is empty, falls back to github.ref
          ref: ${{ github.event.inputs.tag || github.ref }}

      # Inputs go through env rather than `${{ }}` inside the script: an
      # expression is pasted into the shell source before bash parses it, so a
      # tag like `v1"; curl … #` would run as code. As an env var it is data.
      - name: Determine image tag
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            echo "tag=$REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./app
          target: production
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/dholbach/my-practice:${{ steps.meta.outputs.tag }}
            ghcr.io/dholbach/my-practice:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
