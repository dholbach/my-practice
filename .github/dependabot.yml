version: 2

# Grouping: one PR per ecosystem per severity per week, instead of one per
# package. Four ecosystems updating individually produced more review load than
# a solo maintainer clears in a week, and a backlog of dependency PRs is how a
# security update ends up waiting behind nine cosmetic ones.
#
# Patch and minor are deliberately *separate* groups rather than one combined
# group. dependabot/fetch-metadata reports a grouped PR's update-type as the
# highest bump in the group, so a single patch+minor group would report
# `semver-minor` almost every week and the patch auto-merge in
# dependabot-auto-merge.yml would never fire. Split, the patch group merges
# itself once CI is green and only the minor group needs reading.
#
# Major bumps stay ungrouped — those need to be read one at a time. Dependabot
# security updates are never grouped by this config; they always arrive as
# their own PR, which is what you want.
#
# requirements.txt and requirements-dev.txt duplicate every runtime pin on
# purpose; Dependabot updates each file the package appears in, and
# scripts/check_requirements_sync.py fails the PR if one is ever missed.

updates:
    # `directory` must point at the manifests, not the repo root. This said "/"
    # until 2026-09, where there is no requirements file, so Dependabot found no
    # Python dependencies at all and every pin was bumped by hand.
    - package-ecosystem: "pip"
      directory: "/app"
      schedule:
        interval: "weekly"
      open-pull-requests-limit: 5
      groups:
        python-patch:
          patterns: ["*"]
          update-types: ["patch"]
        python-minor:
          patterns: ["*"]
          update-types: ["minor"]

    - package-ecosystem: "npm"
      directory: "/app"
      schedule:
        interval: "weekly"
      open-pull-requests-limit: 5
      groups:
        npm-patch:
          patterns: ["*"]
          update-types: ["patch"]
        npm-minor:
          patterns: ["*"]
          update-types: ["minor"]

    - package-ecosystem: "github-actions"
      directory: "/"
      schedule:
        interval: "weekly"
      open-pull-requests-limit: 5
      groups:
        actions-patch:
          patterns: ["*"]
          update-types: ["patch"]
        actions-minor:
          patterns: ["*"]
          update-types: ["minor"]

    - package-ecosystem: "docker"
      directory: "/app"
      schedule:
        interval: "weekly"
      open-pull-requests-limit: 5
      groups:
        docker-patch:
          patterns: ["*"]
          update-types: ["patch"]
        docker-minor:
          patterns: ["*"]
          update-types: ["minor"]
