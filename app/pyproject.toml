[tool.vulture]
# Exclude patterns
exclude = [
    "*/migrations/*",
    "*/__pycache__/*",
    ".venv/*",
    "venv/*",
    "env/*",
]

# Ignore Django-specific patterns
ignore_names = [
    # Django settings
    "*SECRET_KEY*",
    "*ALLOWED_HOSTS*",
    "*INSTALLED_APPS*",
    "*MIDDLEWARE*",
    "*ROOT_URLCONF*",
    "*TEMPLATES*",
    "*WSGI_APPLICATION*",
    "*DATABASES*",
    "*AUTH_PASSWORD_VALIDATORS*",
    "*LANGUAGE_CODE*",
    "*TIME_ZONE*",
    "*USE_I18N*",
    "*USE_TZ*",
    "*STATIC_*",
    "*STORAGES*",
    "*DEFAULT_AUTO_FIELD*",
    "*LOGGING*",
    "*EMAIL_*",
    "*DEFAULT_FROM_EMAIL*",

    # Django WSGI/ASGI
    "application",

    # Django Admin attributes
    "list_display",
    "list_filter",
    "search_fields",
    "readonly_fields",
    "fieldsets",
    "ordering",
    "date_hierarchy",
    "inlines",
    "short_description",
    "site_header",
    "site_title",
    "index_title",

    # Django Model Meta
    "verbose_name",
    "verbose_name_plural",
    "unique_together",
    "indexes",
    "Meta",

    # Django Forms
    "widgets",
    "labels",

    # Django Views
    "model",
    "form_class",
    "context_object_name",
    "paginate_by",

    # Django Management Commands
    "help",
    "add_arguments",
    "handle",

    # Django URLs
    "urlpatterns",

    # Django Migrations
    "dependencies",
    "operations",

    # Django Apps
    "default_auto_field",

    # Django Middleware
    "process_response",

    # Framework-required callback parameters (not used but required by API)
    "server",  # Gunicorn callbacks (on_starting, on_reload, when_ready)
    "sender",  # Django signal handlers (required by @receiver decorator)
    "db",      # pytest fixtures (required for database access in tests)

    # Model fields (accessed via ORM)
    "created_at",
    "updated_at",
]

# Minimum confidence level (0-100)
# Higher = fewer false positives
min_confidence = 80

# Paths to check
paths = ["app"]

[tool.pytest.ini_options]
# pytest-django: point at Django settings
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["."]
testpaths = ["my_practice/tests"]
addopts = "--tb=short"

[tool.ruff]
line-length = 100
target-version = "py314"
cache-dir = "~/.cache/ruff"
exclude = [
    ".git",
    ".venv",
    "venv",
    "env",
    "__pycache__",
    ".pytest_cache",
    "*/migrations/*",
]

[tool.ruff.lint]
select = [
    "E4",    # pycodestyle errors (imports)
    "E7",    # pycodestyle errors (statements)
    "E9",    # pycodestyle errors (runtime)
    "F",     # pyflakes
    "PERF",  # perflint — performance anti-patterns
    "B",     # flake8-bugbear
    "DJ",    # flake8-django
    "C4",    # flake8-comprehensions
    "SIM",   # flake8-simplify
    "I",     # isort — CLAUDE.md names it as the convention; nothing enforced it
]
# PERF203: try-except-in-loop overhead warning — acceptable in Django views/management commands
# UP034: "extraneous parentheses" — ruff lint counterpart to the formatter bug below; kept in
#        ignore as belt-and-suspenders even though UP is not in `select`.
# DJ012: "save() should come before custom methods". InvoiceItem deliberately groups its
#        validate_*() staticmethods directly above clean() and save(), the two callers that
#        consume them, and both docstrings cross-reference each other by position. Hoisting
#        save() above its own helpers to satisfy a style-guide ordering would read worse and
#        invalidate those references.
ignore = ["PERF203", "UP034", "DJ012"]

[tool.ruff.lint.per-file-ignores]
# B007: an unused loop variable in a range() loop is the normal way to repeat a
# body N times when building fixtures — renaming it to `_` in test data setup
# reads worse than leaving it.
"my_practice/tests/*" = ["B007"]

# Python 3.14 introduced bracketless multi-exception syntax (`except A, B:`)
# as equivalent to `except (A, B):` — see https://github.com/astral-sh/ruff/issues/23090
# ruff format normalises to the bracketless form for target-version = "py314", which
# is correct. No `# fmt: skip` workarounds needed; the old ones have been removed.
